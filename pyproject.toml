[build-system]
requires= ["setuptools>=68"]
build-backend= "setuptools.build_meta"

[project]
name= "ctrlf-aveiro"
version= "0.1.0"
description= "Deteção e catalogação de mobiliário urbano a partir de imagens de rua"
requires-python= ">=3.11"
dependencies= [
    "numpy",
    "opencv-python-headless",
    "pyyaml",
    "python-dotenv",
    "requests",
    "pyproj",
    "scikit-learn",
    "shapely",
    "sqlalchemy>=2",
    "geoalchemy2",
    "psycopg[binary]",
]

[project.optional-dependencies]
ml= ["ultralytics", "transformers", "torch", "torchvision", "pillow"]
api= ["fastapi", "uvicorn", "python-multipart"]
dev= ["pytest", "ruff", "httpx"]

[tool.setuptools.packages.find]
include= ["pipeline*", "backend*", "training*"]

[tool.ruff]
line-length= 100
target-version= "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls= ["fastapi.Depends", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"pipeline/worker.py"= ["BLE001"]

[tool.pytest.ini_options]
testpaths= ["tests"]
