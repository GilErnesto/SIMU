[build-system]
requires= ["setuptools>=68"]
build-backend= "setuptools.build_meta"

[project]
name= "ctrlf-aveiro"
version= "0.1.0"
description= "Deteção e catalogação de mobiliário urbano a partir de imagens de rua"
requires-python= ">=3.11"
dependencies= [
    "numpy",
    "opencv-python-headless",
    "pyyaml",
    "python-dotenv",
    "requests",
    "pyproj",
    "scikit-learn",
    "shapely",
    "sqlalchemy>=2",
    "geoalchemy2",
    "psycopg[binary]",
]

[project.optional-dependencies]
ml= ["ultralytics"]
dev= ["pytest", "ruff"]

[tool.setuptools.packages.find]
include= ["pipeline*"]

[tool.ruff]
line-length= 100
target-version= "py311"

[tool.pytest.ini_options]
testpaths= ["tests"]
