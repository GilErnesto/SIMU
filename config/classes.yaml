# Alturas aproximadas em metros: afinar com medições.
# gerais: classes de recurso, que o passo 2 tenta tornar mais específicas.
# consultas: texto em inglês do passo 1 (OWLv2), só os três grandes.
# descricoes: textos em inglês do passo 2 (CLIP), um ou vários por tipo.
# negativos: textos de coisas parecidas que não contam: a deteção é descartada.
# rotulo e rotulos: nomes mostrados na interface.
# limiar_detecao: confiança mínima de uma deteção, por categoria.
# alcance_max_m: observações estimadas mais longe são ignoradas (60 por omissão).
# seguir_video: nos vídeos, segue cada caixa de frame em frame (um trilho, um elemento).
# tipos_exclusivos: as classes são tipos alternativos do mesmo objeto (um elemento só tem um tipo).
# alturas_por_classe: altura típica por tipo, para a distância monocular (altura_m vale para o resto).
# lado_minimo_px: recortes mais pequenos não vão ao classificador de tipo (12 por omissão).
# inclinacao_panorama: graus; nos panoramas, vistas inclinadas para cima só para esta categoria (postes altos e perto).
# suprimir_contidas: caixa de menor confiança com esta fração dentro de outra maior da mesma imagem é descartada.
categorias:
  sinal:
    rotulo: Sinais
    problemas:
      danificado: Sinal danificado ou partido
      torto: Sinal torto ou caído
      tapado: Tapado por vegetação ou outro objeto
      ilegivel: Desbotado ou ilegível
      vandalizado: Vandalizado (grafitos, autocolantes)
      em_falta: Sinal em falta
      outro: Outro problema
    raio_dedup_m: 5
    altura_m: 0.7
    # 0.40 com o conjunto de quatro detetores (models/detetor.pt, detetor_b23.pt, detetor_b23_1280.pt,
    # detetor_b23p_1280.pt), aumento em teste, a cabeça atual e limiar_descarte 0.7:
    # no conjunto de ouro dá precisão ~0.97 com recall ~0.69.
    limiar_detecao: 0.40
    # O CLIP só deita fora uma caixa (ganhou um texto negativo) com probabilidade >= 0.7; abaixo disso
    # a caixa fica com o melhor tipo real. Com o limiar antigo (0.3) perdiam-se ~30 sinais pequenos.
    limiar_descarte: 0.7
    limiar_especifica: 0.5
    # Categorias oficiais do Regulamento de Sinalização do Trânsito (ver invicta.pt/codigo).
    # stop e limite_velocidade são subtipos de cedencia e proibicao (superclasse).
    # As categorias novas (prescricao, pre_sinalizacao, direcao, confirmacao, localidades,
    # complementares, painel_adicional, turistico, temporaria) não têm descrição para o CLIP:
    # no conjunto de ouro, textos para elas deixavam passar placas de porta e montras
    # (mais falsos alarmes, menos tipos certos). Servem para rotular à mão e para treinar a cabeça.
    classes:
      - perigo
      - cedencia
      - stop
      - proibicao
      - limite_velocidade
      - obrigacao
      - prescricao
      - informacao
      - pre_sinalizacao
      - direcao
      - confirmacao
      - localidades
      - complementares
      - painel_adicional
      - turistico
      - temporaria
      - semaforo
      - outro
    gerais:
      - outro
    rotulos:
      perigo: Sinais de perigo
      cedencia: Cedência de passagem
      stop: Cedência de passagem (STOP)
      proibicao: Proibição
      limite_velocidade: Proibição (limite de velocidade)
      obrigacao: Obrigação
      prescricao: Prescrição específica
      informacao: Informação
      pre_sinalizacao: Pré-sinalização
      direcao: Direção
      confirmacao: Confirmação
      localidades: Localidades
      complementares: Complementares
      painel_adicional: Painel adicional
      turistico: Turístico-cultural
      temporaria: Sinalização temporária
      semaforo: Sinalização luminosa (semáforo)
      outro: Sinal por classificar
    superclasse:
      stop: cedencia
      limite_velocidade: proibicao
    superclasse_padrao: outro
    # A cabeça treinada inventava semáforos em sinais genéricos: só pode dizer semaforo
    # se o zero-shot do CLIP também o escolher ou o detetor já tiver dito semaforo.
    exigem_confirmacao:
      - semaforo
    consultas:
      outro: a traffic sign
      semaforo: a traffic light
    descricoes:
      stop:
        - a red octagonal STOP sign
      cedencia:
        - a triangular give way sign with a red border pointing downwards
        - an inverted triangle road sign with a red border
      limite_velocidade:
        - a round speed limit sign, white with a red border and a number
        - a round sign with a red ring and a black number inside
      proibicao:
        - a round prohibition sign with a red border
        - a red disc with a white horizontal bar
      perigo:
        - a triangular warning sign with a red border and a black symbol
      obrigacao:
        - a round blue mandatory sign with a white arrow
        - a round blue sign with a white symbol
      informacao:
        - a blue square sign with a white letter P, parking
        - a blue square sign with a white triangle and a person, pedestrian crossing
        - a rectangular blue direction sign with white text and an arrow
      semaforo:
        - a traffic light
        - a pedestrian traffic light
    negativos:
      - a house number plate
      - a rectangular grey or white plate with a number on a wall
      - a number painted on the asphalt
      - a door or a window
      - a tree branch or a bare pole
      - a satellite dish or an antenna
      - a shop sign or a banner with text
      - a green shop sign
      - a car or a truck
  iluminacao:
    rotulo: Iluminação
    problemas:
      apagada: Lâmpada apagada à noite
      acesa_de_dia: Acesa durante o dia
      danificado: Poste ou candeeiro danificado
      torto: Poste torto ou caído
      outro: Outro problema
    raio_dedup_m: 6.5
    altura_m: 6
    alcance_max_m: 30
    seguir_video: true
    tipos_exclusivos: true
    alturas_por_classe:
      candeeiro: 4
      poste_luz: 7
    lado_minimo_px: 8
    suprimir_contidas: 0.8
    inclinacao_panorama: 35
    limiar_detecao: 0.3
    classes:
      - luz
      - candeeiro
      - poste_luz
    gerais:
      - luz
    combinar_confianca: false
    calibracao: [[0.30, 0.86], [0.35, 0.88], [0.45, 0.91], [0.55, 0.93], [0.65, 0.96], [0.75, 0.98], [0.90, 0.99]]
    alias:
      candeeiro: luz
    rotulos:
      luz: Luz por classificar
      candeeiro: Candeeiro
      poste_luz: Poste de luz
    consultas:
      luz: a street lamp post
    descricoes:
      candeeiro:
        - a vintage street lantern
        - an old-fashioned decorative street lamp
      poste_luz:
        - a modern street light pole
        - a tall street lamp post
  residuos:
    rotulo: Resíduos
    problemas:
      cheio: Contentor cheio
      danificado: Contentor danificado
      lixo_a_volta: Lixo à volta do contentor
      outro: Outro problema
    raio_dedup_m: 10
    altura_m: 1.2
    limiar_detecao: 0.3
    classes:
      - subterraneo
      - ilha_reciclagem
      - indiferenciado
      - papeleira
      - contentor
    gerais:
      - contentor
    rotulos:
      subterraneo: Contentor subterrâneo
      ilha_reciclagem: Ilha de reciclagem
      indiferenciado: Contentor de indiferenciados
      papeleira: Papeleira
      contentor: Contentor por classificar
    consultas:
      contentor: a waste container
      papeleira: a litter bin
    descricoes:
      subterraneo:
        - an underground waste container, only a small metal column or hatch is visible on the pavement
        - a metal waste loading column on the pavement
      ilha_reciclagem:
        - a recycling station with blue, yellow and green recycling bins
        - several colored recycling containers side by side
      indiferenciado:
        - a large dark wheeled waste bin standing on the street
        - a big green or grey waste container with wheels
      papeleira:
        - a small litter bin on a post or on the pavement
        - a small round public trash can
    negativos:
      - a door or a cabinet on a wall
      - a concrete pillar or a bollard
      - a grey concrete block or a planter
      - a plastic lid or a piece of plastic on the ground
      - a car or a truck
      - a bench
