services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8192}
    volumes:
      - ./config:/app/config:ro
      - type: bind
        source: ./data/anon
        target: /app/data/anon
        bind:
          create_host_path: false
      - type: bind
        source: ./data/raw
        target: /app/data/raw
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/config')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    cpus: ${WORKER_CPUS:-4}
    mem_limit: ${WORKER_MEM:-8g}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OMP_NUM_THREADS: ${WORKER_CPUS:-4}
      MKL_NUM_THREADS: ${WORKER_CPUS:-4}
      MAPILLARY_TOKEN: ${MAPILLARY_TOKEN:-}
    command:
      - python
      - -m
      - pipeline.worker
      - --municipio=/app/config/municipio.yaml
      - --egoblur=/app/models/egoblur
      - --pesos=/app/models/detetor.pt
      - --cabeca-sinal=/app/models/tipo_sinal.npz
      - --raw-dir=/app/data/raw
      - --anon-dir=/app/data/anon
    volumes:
      - ./config:/app/config:ro
      - ${HF_CACHE:-hfcache}:/hf
      - type: bind
        source: ./models
        target: /app/models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/anon
        target: /app/data/anon
        bind:
          create_host_path: false
      - type: bind
        source: ./data/raw
        target: /app/data/raw
        bind:
          create_host_path: false

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"

volumes:
  pgdata:
  hfcache:
